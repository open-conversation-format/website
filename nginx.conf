# www.open-conversation-format.org is the canonical address.
# These other host names are redirected to it when they reach this server.
map $host $ocf_redirect {
    default                           0;
    open-conversation-format.org      1;
    open-conversation-format.com      1;
    www.open-conversation-format.com  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    if ($ocf_redirect) {
        return 301 https://www.open-conversation-format.org$request_uri;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for Docker and Coolify. Kept out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
